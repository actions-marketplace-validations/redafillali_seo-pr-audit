name: SEO audit
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write # commit comment on push
  pull-requests: write

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm run build

      - uses: redafillali/seo-pr-audit@v1
        with:
          comment: true
          static-dir: ./dist
          paths: |
            /
            /about/
