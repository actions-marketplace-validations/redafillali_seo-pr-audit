name: E2E
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  good:
    name: Good fixtures pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          static-dir: test/fixtures/site
          paths: /,/about/
          fail-on: error
          comment: 'false'

  bad:
    name: Bad fixture fails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: audit
        uses: ./
        continue-on-error: true
        with:
          static-dir: test/fixtures/site
          paths: /bad/
          fail-on: error
          lighthouse: 'false'
          comment: 'false'
      - name: Verify the audit reported the failure
        env:
          PASSED: ${{ steps.audit.outputs.passed }}
          ERRORS: ${{ steps.audit.outputs.errors }}
        run: |
          echo "passed=$PASSED errors=$ERRORS"
          test "$PASSED" = "false"
          test "$ERRORS" -gt 0

  comment:
    name: Comment on the PR
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        continue-on-error: true
        with:
          static-dir: test/fixtures/site
          paths: /,/about/,/bad/,/long-title/
          fail-on: never
          lighthouse-runs: 1
          comment: 'true'
